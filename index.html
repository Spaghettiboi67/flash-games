<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Flash Game</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body style="margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; background-color: #000; height: 100vh;">

    <div id="ruffle-container" style="width: 800px; height: 600px;"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            
            container.appendChild(player);

            // PUT YOUR EXACT SWF FILE NAME HERE
            player.load("riddleschool.swf");
            
            player.style.width = "100%";
            player.style.height = "100%";
        });
    </script>
</body>
</html>
